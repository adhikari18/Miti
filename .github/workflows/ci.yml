name: Miti CI (Rust + TypeScript)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    name: Rust Core & WASM Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test on miti-core
        run: cargo test --package miti-core

  typescript-packages:
    name: TypeScript SDK & CLI Build + Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build miti and miti-cli
        run: npm run build

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run Vitest unit test suite
        run: npm test
